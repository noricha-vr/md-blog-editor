# Dependabot の設定。CI が無いので version updates は止め、security updates だけを受ける（2026-10-09 CEO 決定）
# open-pull-requests-limit: 0 は version updates だけを止める（security updates はこの上限の対象外）
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 0
    groups:
      security:                        # security updates も同じエコシステムで 1 本にまとめる
        applies-to: security-updates
        update-types: ["minor", "patch"]
    labels: ["dependencies"]
